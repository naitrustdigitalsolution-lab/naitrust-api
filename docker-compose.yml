version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=naitrust;Username=naitrust;Password=naitrust_dev
      - Redis__ConnectionString=redis:6379
      - Hangfire__ConnectionString=Host=postgres;Port=5432;Database=naitrust;Username=naitrust;Password=naitrust_dev
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: naitrust
      POSTGRES_USER: naitrust
      POSTGRES_PASSWORD: naitrust_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
